name: App Store Review

# Manual fallback (for example to submit an older build or resubmit after a rejection). The normal
# path is the "submit-for-review" job at the end of testflight.yml, which waits for your approval.
# Starting this by hand is the confirmation, so there is no second approval step.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (blank = the most recently uploaded build's version)"
        required: false
      build:
        description: "Build number (blank = the most recently uploaded build)"
        required: false

jobs:
  submit:
    # Only calls the App Store Connect API, so the cheapest Linux runner is plenty.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.json" >> "$GITHUB_ENV"
          jq -n --arg id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" --arg key "$ASC_PRIVATE_KEY" \
            '{key_id: $id, issuer_id: $issuer, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc_api_key.json"

      - name: Decide version and build
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_INPUT: ${{ inputs.build }}
        run: |
          BUNDLE_ID="$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER = ' ./*.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);.*/\1/')"
          if [ -z "$VERSION_INPUT" ] || [ -z "$BUILD_INPUT" ]; then
            read -r LATEST_VERSION LATEST_BUILD <<<"$(.github/scripts/asc.py latest-upload "$BUNDLE_ID")"
          fi
          VERSION="${VERSION_INPUT:-$LATEST_VERSION}"
          if [ -n "$BUILD_INPUT" ]; then
            BUILD="$BUILD_INPUT"
          elif [ "$VERSION" = "${LATEST_VERSION:-}" ]; then
            BUILD="$LATEST_BUILD"
          else
            BUILD="$(.github/scripts/asc.py latest-build "$BUNDLE_ID" "$VERSION")"
          fi
          if [ "$BUILD" = "0" ]; then
            echo "::error::No build of $VERSION in App Store Connect yet"
            exit 1
          fi
          echo "Submitting $BUNDLE_ID $VERSION ($BUILD) for review" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
          } >> "$GITHUB_ENV"

      - name: Wait for App Store Connect to process the build
        run: .github/scripts/asc.py wait-processed "$BUNDLE_ID" "$VERSION" "$BUILD"

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Submit for review
        run: fastlane submit_for_review version:"$VERSION" build:"$BUILD"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_api_key.json" "$RUNNER_TEMP/AuthKey.p8"
