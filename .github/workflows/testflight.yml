name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Override the marketing version (blank = MARKETING_VERSION from the Xcode project)"
        required: false

jobs:
  upload:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    # Only the upload is serialized. A review job waiting for your approval must not hold up the next upload.
    concurrency:
      group: testflight
      cancel-in-progress: false
    outputs:
      bundle_id: ${{ steps.decide.outputs.bundle_id }}
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          MISSING=0
          for NAME in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required secret $NAME is unavailable to the TestFlight job. Configure it in the intended GitHub Actions secret scope."
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Read project settings
        run: .github/scripts/project-settings.sh | tee -a "$GITHUB_ENV"

      - name: Decide version and build number
        id: decide
        env:
          VERSION_OVERRIDE: ${{ inputs.marketing_version }}
        run: |
          VERSION="${VERSION_OVERRIDE:-$MARKETING_VERSION}"

          # Once a version is approved or live, App Store Connect refuses new builds for it.
          STATE="$(.github/scripts/asc.py version-state "$BUNDLE_ID" "$VERSION")"
          case "$STATE" in
            READY_FOR_SALE|READY_FOR_DISTRIBUTION|PENDING_APPLE_RELEASE|PENDING_DEVELOPER_RELEASE|PROCESSING_FOR_APP_STORE|PROCESSING_FOR_DISTRIBUTION|ACCEPTED|REPLACED_WITH_NEW_VERSION|REMOVED_FROM_SALE)
              echo "::error::Version $VERSION is already closed in App Store Connect ($STATE). Bump MARKETING_VERSION and push again."
              exit 1
              ;;
          esac

          # macOS build numbers must increase across marketing versions, not just within one.
          LATEST="$(.github/scripts/asc.py latest-build "$BUNDLE_ID")"
          BUILD=$((LATEST + 1))
          # Never go below what the project itself declares (e.g. a manual bump).
          if [ "$BUILD" -lt "$PROJECT_BUILD" ]; then BUILD="$PROJECT_BUILD"; fi
          echo "Uploading $VERSION ($BUILD); App Store Connect had build $LATEST across all versions"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          {
            echo "bundle_id=$BUNDLE_ID"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          # Distribution certs chain through Apple's WWDR G3 intermediate. Without it the
          # identities are untrusted, Xcode ignores them and falls back to cloud signing.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -t cert -f x509 || true
          security find-identity -v "$KEYCHAIN"
          # The Mac App Store export signs the app and the installer .pkg; both identities must be local.
          for CERT in "Apple Distribution" "3rd Party Mac Developer Installer"; do
            if ! security find-certificate -c "$CERT" "$KEYCHAIN" >/dev/null 2>&1; then
              echo "::error::DIST_CERT_P12 has no \"$CERT\" certificate. Export both the Apple Distribution and the Mac Installer Distribution identities (with private keys) into one .p12."
              exit 1
            fi
          done

      - name: Install provisioning profile
        run: |
          SERIAL="$(security find-certificate -c "Apple Distribution" -p "$RUNNER_TEMP/build.keychain-db" \
            | openssl x509 -noout -serial | cut -d= -f2)"
          PROFILE="$RUNNER_TEMP/AppStore.provisionprofile"
          UUID="$(.github/scripts/asc.py mac-app-store-profile "$BUNDLE_ID" "$SERIAL" "$PROFILE")"
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "Using Mac App Store profile $UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipMacroValidation \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        run: echo "Uploaded $BUNDLE_ID $VERSION ($BUILD_NUMBER) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/AppStore.provisionprofile"

  # Waits for your approval (GitHub notifies you), then submits the uploaded build for App Store
  # review. Runs on a cheap Linux runner and costs nothing while it waits for the approval.
  submit-for-review:
    needs: upload
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: app-store-review
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ needs.upload.outputs.bundle_id }}
      VERSION: ${{ needs.upload.outputs.version }}
      BUILD: ${{ needs.upload.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.json" >> "$GITHUB_ENV"
          jq -n --arg id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" --arg key "$ASC_PRIVATE_KEY" \
            '{key_id: $id, issuer_id: $issuer, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc_api_key.json"

      - name: Wait for App Store Connect to process the build
        run: .github/scripts/asc.py wait-processed "$BUNDLE_ID" "$VERSION" "$BUILD"

      - name: Send release notes to App Store Connect
        run: |
          python3 .github/scripts/release_notes.py check
          .github/scripts/asc.py set-release-notes "$BUNDLE_ID" "$VERSION" fastlane/release_notes

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Submit for review
        run: |
          echo "Submitting $BUNDLE_ID $VERSION ($BUILD) for review" | tee -a "$GITHUB_STEP_SUMMARY"
          fastlane submit_for_review version:"$VERSION" build:"$BUILD"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_api_key.json" "$RUNNER_TEMP/AuthKey.p8"
